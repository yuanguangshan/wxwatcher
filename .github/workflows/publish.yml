name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install build & test deps
        run: |
          pip install build pytest
          pip install .[all] 2>/dev/null || pip install .  # install package + optional deps
      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_config_file.py
      - name: Build
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
